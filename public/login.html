<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوە – بەڕێوەبەرایەتی هاتووچۆی سلێمانی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ku-font: 'Speda', Tahoma, 'Segoe UI', sans-serif;
            --primary: #1a3a6b;
            --primary-light: #2557a7;
            --accent: #c8a84b;
            --accent-light: #f0c842;
            --dark: #0d1b35;
            --card-bg: rgba(13, 27, 53, 0.78);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.18);
            --input-focus-border: #f0c842;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: var(--ku-font);
            min-height: 100vh;
            background: linear-gradient(135deg, #07101e 0%, #0d1f3d 35%, #132d56 70%, #060c18 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* ── Background Animations ── */
        .bg-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 700px 500px at 20% 25%, rgba(37, 87, 167, 0.28) 0%, transparent 70%),
                radial-gradient(ellipse 600px 500px at 80% 75%, rgba(200, 168, 75, 0.15) 0%, transparent 70%);
        }
        .particle {
            position: fixed; border-radius: 50%;
            background: rgba(240, 200, 66, 0.08);
            animation: floatUp linear infinite;
            pointer-events: none; z-index: 0;
        }
        @keyframes floatUp {
            0%   { transform: translateY(110vh) scale(0.3); opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
        }
        .road-anim {
            position: fixed; bottom: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, transparent, var(--accent-light), transparent);
            animation: roadSlide 3s linear infinite; opacity: 0.35; pointer-events: none; z-index: 0;
        }
        @keyframes roadSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* ── Login Container (Large & Prominent) ── */
        .login-wrapper {
            position: relative; z-index: 10;
            width: 100%; max-width: 550px;
            animation: fadeIn 0.45s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Header Area ── */
        .header {
            text-align: center; margin-bottom: 24px;
        }
        .logo-wrap {
            width: 96px; height: 96px; margin: 0 auto 16px; position: relative;
        }
        .logo-wrap::before {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(var(--accent-light) 0%, var(--primary-light) 40%, var(--accent) 75%, var(--accent-light) 100%);
            animation: spinLogo 6s linear infinite;
        }
        @keyframes spinLogo { to { transform: rotate(360deg); } }
        .logo-inner {
            position: relative; width: 100%; height: 100%; background: #0a162b;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 42px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }
        .header-title {
            color: #fef08a; font-size: 21px; font-weight: 900;
            line-height: 1.4; text-shadow: 0 2px 16px rgba(240, 200, 66, 0.3);
            letter-spacing: 0.3px;
        }
        .header-sub {
            color: rgba(255, 255, 255, 0.75); font-size: 14px; margin-top: 6px; font-weight: 600;
        }

        /* ── Card ── */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1.5px solid rgba(240, 200, 66, 0.22);
            border-radius: 24px;
            padding: 38px 36px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .card-title {
            color: #ffffff; font-size: 18px; font-weight: 800;
            text-align: center; margin-bottom: 26px;
            display: flex; align-items: center; gap: 12px;
        }
        .card-title::before, .card-title::after {
            content: ''; flex: 1; height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(240, 200, 66, 0.5));
        }
        .card-title::after {
            background: linear-gradient(270deg, transparent, rgba(240, 200, 66, 0.5));
        }

        /* ── Form Inputs & Comboboxes (Extra Large, Clear, Spacious) ── */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        .form-label {
            display: flex; align-items: center; gap: 8px;
            color: #fde047; font-size: 15px; font-weight: 800;
            margin-bottom: 9px;
            user-select: none;
        }
        .form-label .lbl-icon {
            font-size: 19px;
        }

        .select-wrap-lg, .pass-wrap-lg {
            position: relative;
            width: 100%;
        }

        /* ── Large Editable Combobox Input ── */
        .combo-input-lg {
            width: 100%;
            height: 56px;
            padding: 10px 52px 10px 50px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: #ffffff;
            font-family: var(--ku-font);
            font-size: 16px;
            font-weight: 700;
            direction: rtl;
            text-align: right;
            outline: none;
            transition: all 0.22s ease;
        }
        .combo-input-lg:hover {
            border-color: rgba(240, 200, 66, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }
        .combo-input-lg:focus {
            background: rgba(13, 27, 53, 0.95);
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 4px rgba(240, 200, 66, 0.22);
        }
        .combo-input-lg::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-size: 15px;
            font-weight: 500;
        }
        .select-toggle-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            color: #facc15;
            cursor: pointer;
            font-size: 13px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }
        .select-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-color: #fde047;
        }

        /* ── Suggestions Dropdown ── */
        .combo-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background: #0d1b35;
            border: 1.5px solid rgba(240, 200, 66, 0.35);
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
            z-index: 1000;
            display: none;
            direction: rtl;
            text-align: right;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .combo-dropdown.show {
            display: block;
            animation: comboSlideDown 0.18s ease-out;
        }
        @keyframes comboSlideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .combo-dropdown::-webkit-scrollbar {
            width: 7px;
        }
        .combo-dropdown::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
        }
        .combo-dropdown::-webkit-scrollbar-thumb {
            background: rgba(240, 200, 66, 0.4);
            border-radius: 8px;
        }
        .combo-dropdown::-webkit-scrollbar-thumb:hover {
            background: rgba(240, 200, 66, 0.7);
        }
        .combo-item {
            padding: 12px 18px;
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: all 0.15s ease;
        }
        .combo-item:last-child {
            border-bottom: none;
        }
        .combo-item:hover, .combo-item.active {
            background: rgba(240, 200, 66, 0.2);
            color: #fde047;
            padding-right: 22px;
        }
        .combo-item .highlight {
            color: #fde047;
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .combo-item .item-place {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .combo-item-empty {
            padding: 14px 16px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            text-align: center;
        }

        /* Dropdown Decorators */
        .select-icon-right {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            pointer-events: none;
            user-select: none;
        }

        /* ── Anti-Save Password Input (Type=text with -webkit-text-security) ── */
        .pass-input-lg {
            width: 100%;
            height: 56px;
            padding: 10px 54px 10px 54px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: #ffffff;
            font-family: var(--ku-font);
            font-size: 18px;
            font-weight: 800;
            direction: ltr;
            text-align: left;
            outline: none;
            transition: all 0.22s ease;
            -webkit-text-security: disc !important;
            text-security: disc !important;
            letter-spacing: 3px;
        }
        .pass-input-lg.show-password {
            -webkit-text-security: none !important;
            text-security: none !important;
            letter-spacing: 1px;
        }
        .pass-input-lg:hover {
            border-color: rgba(240, 200, 66, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }
        .pass-input-lg:focus {
            background: rgba(13, 27, 53, 0.95);
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 4px rgba(240, 200, 66, 0.22);
        }
        .pass-input-lg::placeholder {
            letter-spacing: 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 15px;
            direction: rtl;
            text-align: right;
            font-weight: 500;
        }

        .pass-icon-right {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            pointer-events: none;
            user-select: none;
        }
        .toggle-pass-lg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 18px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .toggle-pass-lg:hover {
            color: #fde047;
            background: rgba(255, 255, 255, 0.18);
            border-color: #fde047;
        }

        /* ── Error Banner ── */
        .error-box {
            background: rgba(239, 68, 68, 0.16);
            border: 1.5px solid rgba(239, 68, 68, 0.45);
            border-radius: 12px;
            padding: 13px 18px;
            color: #fca5a5;
            font-size: 14.5px;
            font-weight: 700;
            margin-bottom: 22px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.3s ease;
        }
        .error-box.show { display: flex; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
        }

        /* ── Submit Button (Large, Vibrant & Premium) ── */
        .btn-login {
            width: 100%;
            height: 58px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
            border: none;
            border-radius: 14px;
            color: #0b1528;
            font-family: var(--ku-font);
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        .btn-login:hover::after { left: 100%; }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(245, 158, 11, 0.55);
            filter: brightness(1.06);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        .spin {
            display: inline-block; width: 20px; height: 20px;
            border: 2.5px solid rgba(11, 21, 40, 0.25);
            border-top-color: #0b1528;
            border-radius: 50%;
            animation: spinLogo 0.7s linear infinite;
        }

        .footer {
            text-align: center; margin-top: 24px; color: rgba(255, 255, 255, 0.45); font-size: 13px; font-weight: 600;
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="road-anim"></div>

<div class="login-wrapper">

    <!-- Header Logo & Titles -->
    <div class="header">
        <div class="logo-wrap">
            <div class="logo-inner">🚦</div>
        </div>
        <div class="header-title">بەڕێوەبەرایەتی هاتووچۆی پارێزگای سلێمانی</div>
        <div class="header-sub">هۆبەی پشکنینی ئوتومبێل – چوونەژوورەوەی کارمەندان</div>
    </div>

    <div class="card">
        <div class="card-title">چوونەژوورەوە بۆ سیستم</div>

        <div class="error-box" id="errBox">
            <span style="font-size: 18px;">⚠️</span>
            <span id="errText"></span>
        </div>

        <!-- STRICT ANTI-AUTOFILL & NO-SAVE CREDENTIALS FORM -->
        <form id="loginForm" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onsubmit="doLogin(event)">

            <!-- Decoy fields to completely prevent Chrome/Edge/Windows credential interception -->
            <div style="display:none !important; visibility:hidden; width:0; height:0; position:absolute; left:-9999px;">
                <input type="text" name="decoy_username_field" tabindex="-1" autocomplete="off">
                <input type="password" name="decoy_password_field" tabindex="-1" autocomplete="off">
            </div>

            <!-- 1. USERNAME COMBOBOX (ناوی کارمەند / یوزەر بە نووسین و سێگێست و هەڵبژاردن) -->
            <div class="form-group">
                <label class="form-label" for="userInput">
                    <span class="lbl-icon">👤</span>
                    <span>ناوی کارمەند / یوزەر</span>
                </label>
                <div class="select-wrap-lg" id="userComboWrapper">
                    <span class="select-icon-right">👤</span>
                    <input type="text"
                           class="combo-input-lg"
                           id="userInput"
                           name="sec_user_id"
                           placeholder="ناو بنووسە یان لە لیست هەڵبژێرە..."
                           autocomplete="off"
                           autocorrect="off"
                           autocapitalize="off"
                           spellcheck="false"
                           required>
                    <button type="button" class="select-toggle-btn" id="toggleUserDropdown" title="پیشاندانی هەموو یوزەرەکان">▼</button>
                    <div class="combo-dropdown" id="userDropdown"></div>
                </div>
            </div>

            <!-- 3. PASSWORD (Masked via -webkit-text-security so Browser/Windows never detects it as a password field) -->
            <div class="form-group">
                <label class="form-label" for="passInput">
                    <span class="lbl-icon">🔒</span>
                    <span>تێپەڕەوشە (پاسۆرد)</span>
                </label>
                <div class="pass-wrap-lg">
                    <span class="pass-icon-right">🔑</span>
                    <input type="text"
                           class="pass-input-lg"
                           id="passInput"
                           name="sec_pass_token"
                           autocomplete="off"
                           autocorrect="off"
                           autocapitalize="off"
                           spellcheck="false"
                           data-lpignore="true"
                           data-form-type="other"
                           placeholder="پاسۆردی خۆت بنووسە..."
                           required>
                    <button type="button" class="toggle-pass-lg" id="togglePass" title="پیشاندان / شاردنەوەی پاسۆرد">👁️</button>
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn-login" id="loginBtn">
                <span>🔓 چوونەژوورەوە بۆ سیستم</span>
            </button>
        </form>
    </div>

    <div class="footer">بەڕێوەبەرایەتی هاتووچۆی سلێمانی – بەشی پشکنین و شاسی</div>
</div>

<script>
// ─── Global State ───────────────────────────────────────────────────────────
let allUsers = [];
let activeSuggestionIndex = -1;

const userInput = document.getElementById('userInput');
const userDropdown = document.getElementById('userDropdown');
const toggleDropdownBtn = document.getElementById('toggleUserDropdown');
const userComboWrapper = document.getElementById('userComboWrapper');

// ─── Fetch Users ───────────────────────────────────────────────────────────
async function loadUsersData() {
    try {
        const res = await fetch('/api/users');
        const data = await res.json();

        // Filter and deduplicate
        const seen = new Set();
        allUsers = (data || []).filter(u => {
            if (!u.User_id || seen.has(u.User_id.trim())) return false;
            seen.add(u.User_id.trim());
            return true;
        });

        // Sort alphabetically by User_id
        allUsers.sort((a, b) => (a.User_id || '').localeCompare(b.User_id || '', 'ckb', { sensitivity: 'base' }));

    } catch (err) {
        console.error('Error loading users:', err);
        showError('نەتوانرا لیستی یوزەرەکان لە سێرڤەرەوە بهێنرێت');
    }
}

// ─── Render Suggestions Dropdown (Instant on 1st letter) ────────────────────
function renderSuggestions(query = '', showAllIfEmpty = false) {
    const q = (query || '').trim().toLowerCase();

    let filtered = [];
    if (!q) {
        if (!showAllIfEmpty) {
            closeUserDropdown();
            return;
        }
        filtered = allUsers.slice(0, 100);
    } else {
        const startsWithMatches = [];
        const containsMatches = [];

        allUsers.forEach(u => {
            const name = (u.User_id || '').trim();
            const nameLower = name.toLowerCase();
            const idx = nameLower.indexOf(q);
            if (idx === 0) {
                startsWithMatches.push(u);
            } else if (idx > 0) {
                containsMatches.push(u);
            }
        });

        filtered = [...startsWithMatches, ...containsMatches];
    }

    if (filtered.length === 0) {
        userDropdown.innerHTML = `<div class="combo-item-empty">ناو نەدۆزرایەوە، بەڵام دەتوانیت بە دەستی ناوی "${escapeHtml(query)}" بنووسیت</div>`;
        userDropdown.classList.add('show');
        activeSuggestionIndex = -1;
        return;
    }

    let html = '';
    filtered.forEach((u, i) => {
        const name = (u.User_id || '').trim();
        let displayHtml = escapeHtml(name);

        if (q) {
            const idx = name.toLowerCase().indexOf(q);
            if (idx >= 0) {
                const before = escapeHtml(name.substring(0, idx));
                const match = escapeHtml(name.substring(idx, idx + q.length));
                const after = escapeHtml(name.substring(idx + q.length));
                displayHtml = `${before}<span class="highlight">${match}</span>${after}`;
            }
        }

        const placeTag = (u.Place_ && u.Place_ !== '*') ? `<span class="item-place">${escapeHtml(u.Place_)}</span>` : '';
        html += `<div class="combo-item ${i === 0 && q ? 'active' : ''}" data-value="${escapeHtml(name)}" data-index="${i}">
            <span>${displayHtml}</span>
            ${placeTag}
        </div>`;
    });

    userDropdown.innerHTML = html;
    userDropdown.classList.add('show');
    activeSuggestionIndex = (q && filtered.length > 0) ? 0 : -1;

    // Attach click listener to each suggestion item
    userDropdown.querySelectorAll('.combo-item').forEach(el => {
        el.addEventListener('mousedown', function(e) {
            e.preventDefault();
            selectUserItem(this.dataset.value);
        });
    });
}

function selectUserItem(val) {
    if (!val) return;
    userInput.value = val;
    closeUserDropdown();
    passInput.focus();
}

function closeUserDropdown() {
    userDropdown.classList.remove('show');
    activeSuggestionIndex = -1;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ─── Input Events: Live Suggestions ─────────────────────────────────────────
userInput.addEventListener('input', function() {
    renderSuggestions(this.value, false);
});

userInput.addEventListener('focus', function() {
    if (this.value.trim()) {
        renderSuggestions(this.value, false);
    }
});

// Keyboard Navigation (ArrowUp, ArrowDown, Enter, Escape)
userInput.addEventListener('keydown', function(e) {
    const items = userDropdown.querySelectorAll('.combo-item');
    const isOpen = userDropdown.classList.contains('show');

    if (!isOpen || items.length === 0) {
        if (e.key === 'ArrowDown') {
            renderSuggestions(this.value, true);
        }
        return;
    }

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
        updateActiveSuggestion(items);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
        updateActiveSuggestion(items);
    } else if (e.key === 'Enter') {
        if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
            e.preventDefault();
            selectUserItem(items[activeSuggestionIndex].dataset.value);
        }
    } else if (e.key === 'Escape') {
        closeUserDropdown();
    }
});

function updateActiveSuggestion(items) {
    items.forEach((item, idx) => {
        if (idx === activeSuggestionIndex) {
            item.classList.add('active');
            item.scrollIntoView({ block: 'nearest' });
        } else {
            item.classList.remove('active');
        }
    });
}

// Toggle Dropdown Button
toggleDropdownBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if (userDropdown.classList.contains('show')) {
        closeUserDropdown();
    } else {
        renderSuggestions(userInput.value, true);
        userInput.focus();
    }
});

// Click Outside to Close
document.addEventListener('click', function(e) {
    if (!userComboWrapper.contains(e.target)) {
        closeUserDropdown();
    }
});

// ─── Toggle Password Visibility ─────────────────────────────────────────────
const toggleBtn = document.getElementById('togglePass');
const passInput = document.getElementById('passInput');

toggleBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if (passInput.classList.contains('show-password')) {
        passInput.classList.remove('show-password');
        this.textContent = '👁️';
    } else {
        passInput.classList.add('show-password');
        this.textContent = '🙈';
    }
});

// ─── Do Login (Supports typed name OR selected from suggestions) ─────────────
async function doLogin(e) {
    e.preventDefault();
    hideError();
    closeUserDropdown();

    const username = userInput.value.trim();
    const password = passInput.value.trim();

    if (!username) {
        showError('تکایە ناوی کارمەند / یوزەر بنووسە یان لە لیستەکە هەڵبژێرە');
        userInput.focus();
        return;
    }

    if (!password) {
        showError('تکایە پاسۆردی دروست بنووسە');
        passInput.focus();
        return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> چاوەڕوانبە...';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        // Immediately wipe password from field so no browser/extension caches it
        passInput.value = '';

        if (data.success) {
            if (data.user) {
                const userPlace = (data.user.place !== undefined && data.user.place !== null)
                    ? String(data.user.place).trim()
                    : '';
                localStorage.setItem('activePlace', userPlace);
                localStorage.setItem('activeUser', data.user.name || data.user.username || '');
            }
            btn.innerHTML = '✅ بەسەرکەوتوویی چووینەژوورەوە';
            btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            setTimeout(() => {
                window.location.href = '/index.html';
            }, 600);
        } else {
            showError(data.message || 'ناوی یوزەر یان پاسۆردەکە هەڵەیە');
            btn.disabled = false;
            btn.innerHTML = '<span>🔓 چوونەژوورەوە بۆ سیستم</span>';
            passInput.focus();
        }
    } catch (err) {
        console.error('Login error:', err);
        showError('کێشەی پەیوەندی بە سێرڤەرەوە هەیە');
        btn.disabled = false;
        btn.innerHTML = '<span>🔓 چوونەژوورەوە بۆ سیستم</span>';
    }
}

function showError(msg) {
    const b = document.getElementById('errBox');
    document.getElementById('errText').textContent = msg;
    b.classList.add('show');
}

function hideError() {
    document.getElementById('errBox').classList.remove('show');
}

// ─── Animated Floating Particles ───────────────────────────────────────────
for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = Math.random() * 45 + 15;
    p.style.cssText = `
        width: ${s}px;
        height: ${s}px;
        left: ${Math.random() * 100}%;
        animation-duration: ${Math.random() * 12 + 10}s;
        animation-delay: ${Math.random() * 8}s;
    `;
    document.body.appendChild(p);
}

// Initialize on page load - always show login screen
loadUsersData();
